name: Расширение VS Code

# Собирает расширение «Сфера» для VS Code: в каждый пакет для своей платформы вшивается
# языковой сервер сфера_lsp (он показывает ошибки) и стандартная библиотека (из неё подсказки
# по подключаемым модулям). Подсказки при наборе кода делает JS-движок внутри расширения и
# работают даже в универсальном пакете без сервера.
#
# Запуск вручную: вкладка Actions → «Расширение VS Code» → Run workflow.
#   publish = true  — после сборки выложить все пакеты в маркетплейс VS Code
#                     (доверенная публикация через OIDC: политика у издателя sfera-lang,
#                     репозиторий nikitosklim/Sfera, файл vscode.yml; либо секрет VSCE_PAT).
# Также срабатывает при теге вида vscode-v0.4.0: тогда пакеты публикуются сами.
#
# Сервер собирается БЕЗ LLVM (--no-default-features): ему LLVM не нужен, поэтому сборка быстрая.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Выложить собранные пакеты в маркетплейс VS Code"
        type: boolean
        default: false
  push:
    tags: ["vscode-v*"]
  pull_request:
    paths:
      - "инструменты/sfera-vscode/**"
      - "src/bin/сфера_lsp.rs"
      - "src/подсказки.rs"
      - ".github/workflows/vscode.yml"

permissions:
  contents: write

jobs:
  platform:
    name: ${{ matrix.vsce_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsce_target: win32-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            exe: сфера_lsp.exe
            bin_name: sfera_lsp.exe
          - vsce_target: linux-x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            exe: сфера_lsp
            bin_name: sfera_lsp
          - vsce_target: darwin-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            exe: сфера_lsp
            bin_name: sfera_lsp
          - vsce_target: darwin-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            exe: сфера_lsp
            bin_name: sfera_lsp
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust
        run: rustup target add ${{ matrix.rust_target }}
      - name: Сборка языкового сервера (без LLVM)
        run: cargo build --release --no-default-features --bin сфера_lsp --target ${{ matrix.rust_target }}
      - name: Положить сервер в расширение
        run: |
          mkdir -p "инструменты/sfera-vscode/bin"
          # В пакете расширения имена файлов только латиницей: маркетплейс портит русские имена.
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.exe }}" "инструменты/sfera-vscode/bin/${{ matrix.bin_name }}"
          chmod +x "инструменты/sfera-vscode/bin/${{ matrix.bin_name }}" || true
          ls -la "инструменты/sfera-vscode/bin"
      - name: Установка зависимостей и проверки
        working-directory: инструменты/sfera-vscode
        run: |
          npm ci
          npm run prepare-stdlib
          npm test
      - name: Упаковка расширения
        working-directory: инструменты/sfera-vscode
        run: |
          npx --yes @vscode/vsce ls --target ${{ matrix.vsce_target }} | node scripts/check-ascii.js
          npx --yes @vscode/vsce package --target ${{ matrix.vsce_target }} --out "sfera-${{ matrix.vsce_target }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: инструменты/sfera-vscode/sfera-${{ matrix.vsce_target }}.vsix

  universal:
    # Для платформ без своего пакета (например, Linux на ARM): подсказки работают, ошибки в реальном времени — нет.
    name: universal (без сервера)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка пакета
        working-directory: инструменты/sfera-vscode
        run: |
          npm ci
          npm run prepare-stdlib
          npm test
          npx --yes @vscode/vsce ls | node scripts/check-ascii.js
          npx --yes @vscode/vsce package --out sfera-universal.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-universal
          path: инструменты/sfera-vscode/sfera-universal.vsix

  publish:
    name: Публикация в маркетплейс
    needs: [platform, universal]
    if: startsWith(github.ref, 'refs/tags/vscode-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # приложить пакеты к релизу
      id-token: write   # доверенная публикация (OIDC) — без хранимого токена
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: пакеты
      - name: Список пакетов
        run: ls -la пакеты
      - name: Публикация
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # Основной способ — доверенная публикация (OIDC): секреты не нужны, нужна только политика
          # «Trusted Publishing» у издателя sfera-lang в marketplace.visualstudio.com/manage.
          # Если задан секрет VSCE_PAT (старый способ), используется он.
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath пакеты/*.vsix
          else
            npx --yes @vscode/vsce publish --oidc --packagePath пакеты/*.vsix
          fi
      - name: Приложить пакеты к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: пакеты/*.vsix
