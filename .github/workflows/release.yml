name: Сборка релиза

# Запуск вручную: вкладка Actions → «Сборка релиза» → Run workflow.
# Также срабатывает при публикации тега версии (например v0.3.3):
# собранные архивы автоматически прикладываются к релизу на GitHub.
# Собираются: Linux, Windows, macOS (Apple Silicon и Intel), Android.
# Кроме архивов (zip / tar.xz) собираются установочные файлы: Windows — Sfera-Setup-Windows-<версия>.exe,
# macOS — Sfera-Setup-macOS-<ARM|Intel>-<версия>.dmg, Linux — Sfera-Setup-Linux-<версия>.deb.
# Каждая платформа независима: если одна не собралась, остальные архивы всё равно останутся.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev libffi-dev zlib1g-dev libxml2-dev clang libsdl2-dev libsdl2-ttf-dev xz-utils
      - name: Сборка компилятора и панели
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
          RUST_BACKTRACE: "1"
        run: |
          rustc --version
          /usr/lib/llvm-18/bin/llvm-config --version
          bash -x ./собрать-релиз-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sfera-panel-linux
          path: |
            релиз/Sfera-Panel-Linux.tar.xz
            релиз/Sfera-Setup-Linux-*.deb
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            релиз/Sfera-Panel-Linux.tar.xz
            релиз/Sfera-Setup-Linux-*.deb

  macos:
    name: macOS (Apple Silicon)
    # Если сборка под macOS не удалась, Linux-архив всё равно останется.
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Установка зависимостей
        run: |
          brew install llvm@18 sdl2 sdl2_ttf zstd zlib libxml2 libffi
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix zstd)/lib" >> "$GITHUB_ENV"
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
      - name: Сборка компилятора и приложения
        env:
          RUST_BACKTRACE: "1"
        run: |
          rustc --version
          "$(brew --prefix llvm@18)/bin/llvm-config" --version
          bash -x ./собрать-релиз-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sfera-panel-macos-arm64
          path: |
            релиз/Sfera-Panel-macOS.zip
            релиз/Sfera-Setup-macOS-*.dmg
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            релиз/Sfera-Panel-macOS.zip
            релиз/Sfera-Setup-macOS-*.dmg

  android:
    name: Android (ARM64, с компилятором)
    # Как и macOS: если не вышло, остальные архивы всё равно останутся.
    continue-on-error: true
    runs-on: ubuntu-24.04
    # Первый запуск собирает LLVM под Android (1–2 часа) и кладёт его в кэш,
    # дальше этот этап занимает несколько минут. Кэш общий с «Компилятор для Android».
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Освобождаем место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev libffi-dev zlib1g-dev libxml2-dev clang cmake ninja-build fonts-dejavu-core
      - name: Кэш LLVM под Android
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: релиз/android-llvm
          key: android-llvm-18.1.3-api23-v1-${{ hashFiles('собрать-android-компилятор.sh') }}
      - name: Сборка LLVM, lld и libffi под Android
        run: bash -x ./собрать-android-компилятор.sh llvm
      - name: Сохранить кэш LLVM
        if: always() && steps.cache.outputs.cache-hit != 'true' && hashFiles('релиз/android-llvm/install/lib/libLLVMCore.a') != ''
        uses: actions/cache/save@v4
        with:
          path: релиз/android-llvm
          key: android-llvm-18.1.3-api23-v1-${{ hashFiles('собрать-android-компилятор.sh') }}
      - name: Сборка компилятора Сферы под Android
        env:
          RUST_BACKTRACE: "1"
        run: bash -x ./собрать-android-компилятор.sh compiler
      - name: Ключ подписи Android (если задан в секретах)
        env:
          KS_B64: ${{ secrets.SFERA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SFERA_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sfera.keystore"
            echo "SFERA_KEYSTORE=$RUNNER_TEMP/sfera.keystore" >> "$GITHUB_ENV"
            echo "SFERA_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ"
          else
            echo "Подпись: одноразовый отладочный ключ (секрет SFERA_KEYSTORE_B64 не задан)"
          fi
      - name: Сборка APK панели с компилятором
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
          RUST_BACKTRACE: "1"
        run: bash -x ./собрать-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sfera-panel-android
          path: релиз/Sfera-Panel-Android.apk
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: релиз/Sfera-Panel-Android.apk

  macos-intel:
    name: macOS (Intel)
    continue-on-error: true
    # Отдельный раннер на процессоре Intel; macos-latest даёт только Apple Silicon.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Установка зависимостей
        run: |
          brew install llvm@18 sdl2 sdl2_ttf zstd zlib libxml2 libffi
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix zstd)/lib" >> "$GITHUB_ENV"
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
      - name: Сборка компилятора и приложения
        env:
          RUST_BACKTRACE: "1"
        run: |
          rustc --version
          "$(brew --prefix llvm@18)/bin/llvm-config" --version
          bash -x ./собрать-релиз-macos.sh
          # Имя с пометкой Intel, чтобы не совпало с архивом для Apple Silicon.
          mv релиз/Sfera-Panel-macOS.zip релиз/Sfera-Panel-macOS-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sfera-panel-macos-intel
          path: |
            релиз/Sfera-Panel-macOS-Intel.zip
            релиз/Sfera-Setup-macOS-*.dmg
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            релиз/Sfera-Panel-macOS-Intel.zip
            релиз/Sfera-Setup-macOS-*.dmg

  windows:
    name: Windows (x86-64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Inno Setup собирает установщик панели (Sfera-Setup-Windows-<версия>.exe).
      - name: Установка Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # Тот же установщик, которым пользуются люди: он ставит LLVM 18, SDL2 и рантайм потоков,
      # затем собирает компилятор. Скачивание LLVM (около 500 МБ) занимает несколько минут.
      - name: Установка окружения и сборка архива
        # Внешняя оболочка pwsh (PowerShell 7) читает файл шага как UTF-8: русские имена не портятся.
        # Сами скрипты запускаются тем же Windows PowerShell, на котором их проверяли вручную.
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\установить-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Установщик записал переменные (LLVM_SYS_180_PREFIX, SFERA_LIB_PATHS, Path) на уровне пользователя,
          # а новый процесс их не видит: подхватываем вручную перед сборкой архива.
          foreach ($имя in 'LLVM_SYS_180_PREFIX', 'SFERA_LIB_PATHS', 'SFERA_PTHREAD_WIN_O') {
            $значение = [Environment]::GetEnvironmentVariable($имя, 'User')
            if ($значение) { Set-Item -Path "env:$имя" -Value $значение }
          }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\собрать-релиз-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Проверяем именно готовый архив, как его получит человек: распаковываем в чистую папку, без переменных
      # окружения установщика, и запускаем из неё компилятор на примере «Привет, мир!».
      - name: Проверка готового архива
        shell: pwsh
        run: |
          $Пути = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $env:Path = $Пути
          foreach ($имя in 'LLVM_SYS_180_PREFIX', 'SFERA_LIB_PATHS', 'SFERA_PTHREAD_WIN_O') { Remove-Item "env:$имя" -ErrorAction SilentlyContinue }
          $Архив = Resolve-Path 'релиз/Sfera-Panel-Windows.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($Архив)
          $имена = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          $zip.Dispose()
          foreach ($нужен in 'Sfera-Panel-Windows/Sfera-Panel.exe', 'Sfera-Panel-Windows/bin/запустить.exe', 'Sfera-Panel-Windows/bin/сфера_lsp.exe', 'Sfera-Panel-Windows/bin/сфера_пакеты.exe', 'Sfera-Panel-Windows/bin/сфера.exe', 'Sfera-Panel-Windows/lib/sfera/pthread_win.o') {
            if (-not ($имена -contains $нужен)) { Write-Host "В архиве нет $нужен. Есть:"; $имена | ForEach-Object { Write-Host "  $_" }; exit 1 }
          }
          if (-not ($имена | Where-Object { $_ -like 'Sfera-Panel-Windows/*.dll' })) { Write-Host 'В архиве нет DLL графики'; exit 1 }
          $Чисто = Join-Path $env:RUNNER_TEMP 'проверка-архива'
          if (Test-Path $Чисто) { Remove-Item -Recurse -Force $Чисто }
          Expand-Archive -Path $Архив -DestinationPath $Чисто
          $Папка = Join-Path $Чисто 'Sfera-Panel-Windows'
          $Рабочая = Join-Path $Чисто 'работа'
          New-Item -ItemType Directory -Force -Path $Рабочая | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $Рабочая 'привет.код'), "функция главная(): целое`n    вывести(`"Привет, мир!`");`n    вернуть 0;`nконец`n", (New-Object System.Text.UTF8Encoding($false)))
          Push-Location $Рабочая
          $вывод = & (Join-Path $Папка 'bin\запустить.exe') 'привет.код' 2>&1 | Out-String
          $код = $LASTEXITCODE
          Pop-Location
          Write-Host $вывод
          if ($код -ne 0 -or $вывод -notmatch 'Привет, мир!') { Write-Host "Программа из архива не запустилась (код $код)"; exit 1 }
          Write-Host 'Архив проверен: компилятор из него собирает и запускает программу.'
      - uses: actions/upload-artifact@v4
        with:
          name: sfera-panel-windows
          path: |
            релиз/Sfera-Panel-Windows.zip
            релиз/Sfera-Setup-Windows-*.exe
          compression-level: 0
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            релиз/Sfera-Panel-Windows.zip
            релиз/Sfera-Setup-Windows-*.exe
