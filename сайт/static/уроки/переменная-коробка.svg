<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Переменная как коробка с подписью">
<style>text{font:16px system-ui,sans-serif;fill:#8aa0ff}.c{fill:none;stroke:#8aa0ff;stroke-width:2}.t{fill:#b9c4e8}.big{font-size:30px;font-weight:700}</style>
<rect class="c" x="40" y="60" width="150" height="110" rx="12"/><rect class="c" x="40" y="40" width="150" height="26" rx="8"/>
