[package]
name = "sfera"
version = "0.1.0"
edition = "2021"
description = "Компилятор языка программирования «Сфера» (файлы .код)"

[[bin]]
name = "sfera"
path = "src/main.rs"

[dependencies]
# LLVM-бэкенд для генерации машинного кода.
# ВАЖНО: помимо этой Rust-зависимости, на компьютере должен быть физически
# установлен сам LLVM версии 18 (это внешний, системный компилятор,
# а не то, что подтягивается через cargo). См. README ниже про установку.
inkwell = { version = "0.5", features = ["llvm18-0"] }

# Для языкового сервера (src/bin/сфера_lsp.rs) — НЕ нужны компилятору
# самому по себе (main.rs их не использует), но раз уж они в общем списке
# зависимостей пакета, cargo build соберёт лишнее и для обычного
# компилятора тоже — небольшая, но осознанная цена за простоту, вместо
# выделения языкового сервера в отдельный под-пакет (workspace).
lsp-server = "0.7"
lsp-types = "0.95"
serde = "1.0"
serde_json = "1.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
