[package]
name = "sfera"
version = "0.3.1"
edition = "2021"
description = "Компилятор языка программирования «Сфера» (файлы .код)"

[[bin]]
name = "запустить"
path = "src/main.rs"

[dependencies]
# LLVM-бэкенд для генерации машинного кода.
# ВАЖНО: помимо этой Rust-зависимости, на компьютере должен быть физически
# установлен сам LLVM версии 18 (это внешний, системный компилятор,
# а не то, что подтягивается через cargo). См. README ниже про установку.
#
# ⚠️ НАЙДЕНО РЕАЛЬНОЙ ПРОВЕРКОЙ (Windows, после первой попытки исправить
# линковку через llvm-sys/disable-alltargets-init — не помогло целиком):
# у самого inkwell в его Cargo.toml есть "default = ["target-all"]" — то
# есть без явного "default-features = false" ВСЕ таргет-функции inkwell
# (initialize_webassembly, initialize_loongarch, initialize_systemz и
# десятки других) всё равно компилировались в саму библиотеку inkwell,
# СОВЕРШЕННО НЕЗАВИСИМО от "disable-alltargets-init" у llvm-sys (та фича
# отключает только ОДИН вспомогательный C-файл "target.c" — к этим
# Rust-функциям inkwell никак не относится). Ни одна из них нигде не
# вызывается в этом проекте (используются только initialize_native/
# initialize_all/initialize_aarch64/initialize_x86 — см. codegen.rs), но
# раз они в принципе СКОМПИЛИРОВАНЫ в inkwell, линковщик на Windows (где
# готовый пакет LLVM не содержит библиотек для всех таргетов) по-прежнему
# требовал разрешить все их символы. "default-features = false" — реальное
# решение: убирает эти функции из сборки inkwell вообще, на всех платформах
# (не только Windows) — безопасно, потому что initialize_native/
# initialize_all (используются на macOS/Linux) никакой таргет-фичей не
# гейтятся вовсе (см. комментарий у initialize_x86 в codegen.rs).
inkwell = { version = "0.5", default-features = false, features = ["llvm18-0", "target-aarch64", "target-x86"] }

# Для языкового сервера (src/bin/сфера_lsp.rs) — НЕ нужны компилятору
# самому по себе (main.rs их не использует), но раз уж они в общем списке
# зависимостей пакета, cargo build соберёт лишнее и для обычного
# компилятора тоже — небольшая, но осознанная цена за простоту, вместо
# выделения языкового сервера в отдельный под-пакет (workspace).
lsp-server = "0.7"
lsp-types = "0.95"
serde = "1.0"
serde_json = "1.0"

# НОВОЕ: НАЙДЕНО РЕАЛЬНОЙ ПРОВЕРКОЙ — при кросс-компиляции самого
# компилятора под Android линковка падала с десятками "undefined
# symbol: LLVMInitializeXXXTargetInfo" (для AMDGPU, ARM, X86 и т.д.) —
# причина не в нашем коде (см. codegen.rs, обе ветки уже переключены на
# initialize_aarch64), а в том, что llvm-sys САМ, при своей сборке,
# безусловно компилирует вспомогательный C-файл ("wrappers/target.c"),
# который ссылается на ВСЕ таргеты LLVM разом — линковщик требует
# разрешить все эти символы, даже если наш код их не вызывает вообще.
# Наша Android-сборка LLVM специально ограничена только AArch64
# (экономия времени сборки) — эти функции для остальных таргетов
# просто не существуют. "disable-alltargets-init" (родная фича
# llvm-sys) полностью отключает компиляцию этого файла.
#
# НОВОЕ: НАЙДЕНО РЕАЛЬНОЙ ПРОВЕРКОЙ (теперь на настоящей Windows-машине) —
# ТОЧНО ТАКАЯ ЖЕ ошибка (десятки "неразрешённых внешних элементов" для
# LLVMInitializeLoongArchTarget, LLVMInitializeWebAssemblyTarget и т.д.,
# "error LNK2019"/"LNK1120"), хотя это самая обычная host-сборка на x86_64,
# не кросс-компиляция. Причина та же: готовый пакет LLVM для Windows
# (vovkos/llvm-package-windows, который ставит установить-windows.ps1) не
# включает статические библиотеки для ВСЕХ таргетов LLVM (в отличие от
# пакетов LLVM для macOS/Linux из системных менеджеров пакетов, где собраны
# все) — а target.c требует их все разом, даже если из Rust-кода вызывается
# только initialize_native() для ОДНОГО, родного таргета (x86_64) — весь
# .o-файл с wrapper-функциями тянется в линковку целиком, со всеми
# неиспользуемыми ссылками внутри него. Решение то же, что и для Android:
# отключаем target.c и для Windows тоже, а codegen.rs (сM. записать_
# объектный_файл) для Windows переключён на initialize_x86 — это НАСТОЯЩАЯ,
# не inline-обёрточная функция самого LLVM (LLVMInitializeX86Target
# экспортирована напрямую из библиотеки), так что target.c ей не нужен —
# тот же приём, что уже работал для initialize_aarch64 на Android.
[target.'cfg(any(target_os = "android", target_os = "windows"))'.dependencies]
llvm-sys = { version = "180.0.0", features = ["disable-alltargets-init"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
